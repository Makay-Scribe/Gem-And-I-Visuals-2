<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Three.js GPGPU - Flow Map Prototype</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
		/>
		<style>
			body { margin: 0; background-color: #000; color: #fff; font-family: Monospace; font-size: 13px; line-height: 24px; overscroll-behavior: none; }
			a { color: #ff0; text-decoration: none; }
			button { cursor: pointer; text-transform: uppercase; }
			#info { position: absolute; top: 0px; width: 100%; padding: 10px; box-sizing: border-box; text-align: center; pointer-events: none; z-index: 1; }
			a, button, input, select { pointer-events: auto; }
			.lil-gui { z-index: 3; }
		</style>
	</head>
	<body>
		<div id="container"></div>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a>
			- GPGPU - Flow Map Prototype
		</div>
        
		<input type="file" id="model-file-input" accept=".glb,.gltf" style="display: none;">

		<script type="importmap">
			{ "imports": { "three": "https://unpkg.com/three@0.165.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/" } }
		</script>
		<script type="module">
			import * as THREE from "three";
			import { GUI } from "three/addons/libs/lil-gui.module.min.js";
			import { GPUComputationRenderer } from "three/addons/misc/GPUComputationRenderer.js";
			import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

			// --- AI --- Renamed for clarity
			let particleCompute, fluidCompute;
			let landscapeParticles, landscapeContainer;
			let particleVelocityVar, particlePositionVar;
			// --- AI --- New GPGPU variables for the fluid simulation
			let fluidVelocityVar, fluidPressureVar, fluidDivergenceVar;
			
			let container, camera, scene, renderer, gui, clock;
			let targetPositionTexture, flatPositionTexture, controlTexture;
            let sunLight, hemisphereLight;
			let isDragging = false;
			let previousMousePosition = { x: 0, y: 0 };
			const gltfLoader = new GLTFLoader();
			let targetModelMesh = null;
			let params = {};
			let activeTransition = null;

			// -- AI -- Particle Simulation Resolution
			const P_GPGPU_WIDTH = 640;
			const P_GPGPU_HEIGHT = 360;
			const PARTICLE_COUNT = P_GPGPU_WIDTH * P_GPGPU_HEIGHT;
			
			// -- AI -- NEW Fluid Simulation Resolution (lower for performance)
			const F_GPGPU_WIDTH = 128;
			const F_GPGPU_HEIGHT = 128;

			const BOUNDS_X = 53.33;
			const BOUNDS_Y = 30;

			// --- SHADERS ---
			// Common noise functions needed for particle turbulence
			const commonShader = `
				vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; } vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; } vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); } vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
				float snoise(vec3 v) {
					const vec2 C = vec2(1.0/6.0, 1.0/3.0) ; const vec4 D = vec4(0.0, 0.5, 1.0, 2.0); vec3 i  = floor(v + dot(v, C.yyy) ); vec3 x0 = v - i + dot(i, C.xxx) ; vec3 g = step(x0.yzx, x0.xyz); vec3 l = 1.0 - g; vec3 i1 = min( g.xyz, l.zxy ); vec3 i2 = max( g.xyz, l.zxy ); vec3 x1 = x0 - i1 + C.xxx; vec3 x2 = x0 - i2 + C.yyy; vec3 x3 = x0 - D.yyy; i = mod289(i); vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 )); float n_ = 0.142857142857; vec3 ns = n_ * D.wyz - D.xzx; vec4 j = p - 49.0 * floor(p * ns.z * ns.z); vec4 x_ = floor(j * ns.z); vec4 y_ = floor(j - 7.0 * x_ ); vec4 x = x_ *ns.x + ns.yyyy; vec4 y = y_ *ns.x + ns.yyyy; vec4 h = 1.0 - abs(x) - abs(y); vec4 b0 = vec4( x.xy, y.xy ); vec4 b1 = vec4( x.zw, y.zw ); vec4 s0 = floor(b0)*2.0 + 1.0; vec4 s1 = floor(b1)*2.0 + 1.0; vec4 sh = -step(h, vec4(0.0)); vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ; vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ; vec3 p0 = vec3(a0.xy,h.x); vec3 p1 = vec3(a0.zw,h.y); vec3 p2 = vec3(a1.xy,h.z); vec3 p3 = vec3(a1.zw,h.w); vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3))); p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w; vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0); m = m * m; return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
				}`;

			// Particle Shaders (simplified for now)
			const particlePositionShader = `
				uniform float u_deltaTime;
				void main() {
					vec2 uv = gl_FragCoord.xy / resolution.xy;
					vec4 velocityData = texture2D(textureVelocity, uv);
					vec3 position = texture2D(texturePosition, uv).xyz;
					position += velocityData.xyz * u_deltaTime;
					gl_FragColor = vec4(position, 1.0);
				}`;
			const particleVelocityShader = `void main() { gl_FragColor = texture2D( textureVelocity, gl_FragCoord.xy / resolution.xy ); }`; // Placeholder

			// --- AI --- NEW FLUID SIMULATION SHADERS ---
			const advectionShader = `
				uniform sampler2D u_velocity; uniform sampler2D u_source; uniform vec2 u_texelSize; uniform float u_deltaTime; uniform float u_dissipation;
				void main() {
					vec2 coord = gl_FragCoord.xy - u_deltaTime * u_texelSize * texture2D(u_velocity, gl_FragCoord.xy / resolution.xy).xy;
					gl_FragColor = u_dissipation * texture2D(u_source, coord / resolution.xy);
				}`;
			const divergenceShader = `
				uniform sampler2D u_velocity; uniform vec2 u_texelSize;
				void main() {
					float L = texture2D(u_velocity, (gl_FragCoord.xy - vec2(1, 0)) / resolution.xy).x;
					float R = texture2D(u_velocity, (gl_FragCoord.xy + vec2(1, 0)) / resolution.xy).x;
					float B = texture2D(u_velocity, (gl_FragCoord.xy - vec2(0, 1)) / resolution.xy).y;
					float T = texture2D(u_velocity, (gl_FragCoord.xy + vec2(0, 1)) / resolution.xy).y;
					gl_FragColor.x = 0.5 * (R - L + T - B);
				}`;
			const pressureShader = `
				uniform sampler2D u_pressure; uniform sampler2D u_divergence; uniform vec2 u_texelSize;
				void main() {
					float L = texture2D(u_pressure, (gl_FragCoord.xy - vec2(1, 0)) / resolution.xy).x;
					float R = texture2D(u_pressure, (gl_FragCoord.xy + vec2(1, 0)) / resolution.xy).x;
					float B = texture2D(u_pressure, (gl_FragCoord.xy - vec2(0, 1)) / resolution.xy).x;
					float T = texture2D(u_pressure, (gl_FragCoord.xy + vec2(0, 1)) / resolution.xy).x;
					float C = texture2D(u_pressure, gl_FragCoord.xy / resolution.xy).x;
					float divergence = texture2D(u_divergence, gl_FragCoord.xy / resolution.xy).x;
					gl_FragColor.x = (L + R + B + T - divergence) * 0.25;
				}`;
			const gradientSubtractShader = `
				uniform sampler2D u_pressure; uniform sampler2D u_velocity; uniform vec2 u_texelSize;
				void main() {
					float L = texture2D(u_pressure, (gl_FragCoord.xy - vec2(1, 0)) / resolution.xy).x;
					float R = texture2D(u_pressure, (gl_FragCoord.xy + vec2(1, 0)) / resolution.xy).x;
					float B = texture2D(u_pressure, (gl_FragCoord.xy - vec2(0, 1)) / resolution.xy).x;
					float T = texture2D(u_pressure, (gl_FragCoord.xy + vec2(0, 1)) / resolution.xy).x;
					vec2 velocity = texture2D(u_velocity, gl_FragCoord.xy / resolution.xy).xy;
					gl_FragColor.xy = velocity - 0.5 * vec2(R - L, T - B);
					gl_FragColor.zw = vec2(0.0);
				}`;
			const splatShader = `
				uniform sampler2D u_target; uniform float u_aspectRatio; uniform vec3 u_color; uniform vec2 u_point; uniform float u_radius;
				void main() {
					vec2 p = (gl_FragCoord.xy / resolution.xy) - u_point; p.x *= u_aspectRatio;
					vec3 splat = exp(-dot(p, p) / u_radius) * u_color;
					vec3 base = texture2D(u_target, gl_FragCoord.xy / resolution.xy).xyz;
					gl_FragColor = vec4(base + splat, 1.0);
				}`;
			// This shader helps us see the flow map for debugging
			const displayShader = `
				uniform sampler2D u_texture;
				void main() {
					vec3 v = texture2D(u_texture, gl_FragCoord.xy / resolution.xy).xyz;
					gl_FragColor = vec4(v * 0.5 + 0.5, 1.0); // Remap velocity from [-1, 1] to [0, 1] for display
				}`;
			
			// --- MOUSE & POINTER STATE ---
			const pointer = { down: false, move: false, x: 0, y: 0, prevX: 0, prevY: 0, deltaX: 0, deltaY: 0 };
			
			init();
			animate();

			function init() {
				container = document.getElementById("container");
				scene = new THREE.Scene();
				scene.background = new THREE.Color(0x050005);
				camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
				camera.position.set(0, 0, 45);
				camera.lookAt(scene.position);
				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				container.appendChild(renderer.domElement);
				clock = new THREE.Clock();
				landscapeContainer = new THREE.Group();
				scene.add(landscapeContainer);
				
				initParticleGPGPU();
				initFluidGPGPU(); // -- AI -- Initialize the new fluid simulation
				initLandscape();
				initGUI();

				// --- AI -- Add mouse listeners for interactivity ---
				renderer.domElement.addEventListener('pointerdown', e => { pointer.down = true; pointer.x = e.pageX; pointer.y = e.pageY; pointer.prevX = e.pageX; pointer.prevY = e.pageY; });
				renderer.domElement.addEventListener('pointermove', e => { if(pointer.down) { pointer.move = true; pointer.x = e.pageX; pointer.y = e.pageY;} });
				renderer.domElement.addEventListener('pointerup', () => { pointer.down = false; pointer.move = false; });
				window.addEventListener("resize", onWindowResize);
			}

			function initParticleGPGPU() {
				particleCompute = new GPUComputationRenderer(P_GPGPU_WIDTH, P_GPGPU_HEIGHT, renderer);
				if (!renderer.capabilities.isWebGL2) particleCompute.setDataType(THREE.HalfFloatType);
				
				const dtPosition = particleCompute.createTexture();
				const dtVelocity = particleCompute.createTexture();
				const dtControl = particleCompute.createTexture();
				
				targetPositionTexture = particleCompute.createTexture();
				flatPositionTexture = particleCompute.createTexture();
				
				// Fill particle textures
				const posArray = dtPosition.image.data; const velArray = dtVelocity.image.data;
				const flatArray = flatPositionTexture.image.data; const controlArray = dtControl.image.data;
				for (let i = 0; i < PARTICLE_COUNT; i++) {
					const k = i * 4;
					const u = (i % P_GPGPU_WIDTH) / (P_GPGPU_WIDTH - 1); const v = Math.floor(i / P_GPGPU_WIDTH) / (P_GPGPU_HEIGHT - 1);
					const worldX = u * BOUNDS_X - BOUNDS_X / 2; const worldY = v * BOUNDS_Y - BOUNDS_Y / 2;
					posArray[k + 0] = worldX; posArray[k + 1] = worldY; posArray[k + 2] = 0; posArray[k + 3] = 1.0;
					velArray[k + 0] = 0; velArray[k + 1] = 0; velArray[k + 2] = 0; velArray[k + 3] = 0.0;
					flatArray[k + 0] = worldX; flatArray[k + 1] = worldY; flatArray[k + 2] = 0; flatArray[k + 3] = 1.0;
					controlArray[k + 0] = Math.random(); controlArray[k + 1] = v; controlArray[k + 2] = Math.random(); controlArray[k + 3] = 1.0;
				}

				particleVelocityVar = particleCompute.addVariable("textureVelocity", particleVelocityShader, dtVelocity);
				particlePositionVar = particleCompute.addVariable("texturePosition", particlePositionShader, dtPosition);
				controlTexture = dtControl;
				particleCompute.setVariableDependencies(particleVelocityVar, [particlePositionVar, particleVelocityVar]);
				particleCompute.setVariableDependencies(particlePositionVar, [particlePositionVar, particleVelocityVar]);
				
				const error = particleCompute.init();
				if (error) console.error("Particle GPGPU Error:", error);
			}

			// --- AI --- NEW function to initialize the fluid simulation
			function initFluidGPGPU() {
				fluidCompute = new GPUComputationRenderer(F_GPGPU_WIDTH, F_GPGPU_HEIGHT, renderer);
				if (!renderer.capabilities.isWebGL2) fluidCompute.setDataType(THREE.HalfFloatType);
				
				const dtVelocity = fluidCompute.createTexture();
				const dtPressure = fluidCompute.createTexture();
				const dtDivergence = fluidCompute.createTexture();

				fluidVelocityVar = fluidCompute.addVariable("u_velocity", advectionShader, dtVelocity);
				fluidPressureVar = fluidCompute.addVariable("u_pressure", pressureShader, dtPressure);
				fluidDivergenceVar = fluidCompute.addVariable("u_divergence", divergenceShader, dtDivergence);
				
				fluidCompute.setVariableDependencies(fluidVelocityVar, [fluidVelocityVar]);
				fluidCompute.setVariableDependencies(fluidPressureVar, [fluidPressureVar, fluidDivergenceVar]);
				
				// Add uniforms
				fluidVelocityVar.material.uniforms['u_source'] = { value: null };
				fluidVelocityVar.material.uniforms['u_texelSize'] = { value: new THREE.Vector2(1.0 / F_GPGPU_WIDTH, 1.0 / F_GPGPU_HEIGHT) };
				fluidVelocityVar.material.uniforms['u_deltaTime'] = { value: 0.0 };
				fluidVelocityVar.material.uniforms['u_dissipation'] = { value: 0.99 };

				fluidDivergenceVar.material.uniforms['u_velocity'] = { value: null };
				fluidDivergenceVar.material.uniforms['u_texelSize'] = { value: new THREE.Vector2(1.0 / F_GPGPU_WIDTH, 1.0 / F_GPGPU_HEIGHT) };
				
				fluidPressureVar.material.uniforms['u_divergence'] = { value: null };
				fluidPressureVar.material.uniforms['u_texelSize'] = { value: new THREE.Vector2(1.0 / F_GPGPU_WIDTH, 1.0 / F_GPGPU_HEIGHT) };
				
				const error = fluidCompute.init();
				if (error) console.error("Fluid GPGPU Error:", error);
			}
			
			function initLandscape() {
				const particleGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(PARTICLE_COUNT * 3);
				particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const uvs = new Float32Array(PARTICLE_COUNT * 2);
				for (let y = 0; y < P_GPGPU_HEIGHT; y++) {
					for (let x = 0; x < P_GPGPU_WIDTH; x++) {
						const i = (y * P_GPGPU_WIDTH + x) * 2;
						uvs[i + 0] = x / (P_GPGPU_WIDTH - 1); uvs[i + 1] = y / (P_GPGPU_HEIGHT - 1);
					}
				}
				particleGeometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
				
                const vertexShader = `
                    uniform sampler2D texturePosition; uniform float pointSize; varying vec2 vUv;
                    void main() {
						vUv = uv; 
						vec3 pos_center = texture2D(texturePosition, uv).xyz;
                        vec4 mvPosition = modelViewMatrix * vec4(pos_center, 1.0);
                        gl_Position = projectionMatrix * mvPosition;
                        gl_PointSize = pointSize * (200.0 / -mvPosition.z);
                    }`;

                const fragmentShader = `
					uniform sampler2D u_flowMap; // This will be the fluid velocity texture
					uniform bool u_debugFlow;
					varying vec2 vUv;
                    void main() {
						if (distance(gl_PointCoord, vec2(0.5)) > 0.5) discard;
						
						if (u_debugFlow) {
							vec2 flow = texture2D(u_flowMap, vUv).xy;
							gl_FragColor = vec4(flow.x * 0.5 + 0.5, flow.y * 0.5 + 0.5, 0.0, 1.0);
						} else {
							gl_FragColor = vec4(1.0);
						}
                    }`;

				const particleMaterial = new THREE.ShaderMaterial({
					uniforms: {
						texturePosition: { value: null },
						pointSize: { value: 1.0 },
						u_flowMap: { value: null },
						u_debugFlow: { value: false },
					},
					vertexShader, fragmentShader, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
				});

				landscapeParticles = new THREE.Points(particleGeometry, particleMaterial);
				landscapeContainer.add(landscapeParticles);
			}
						
			function initGUI() {
				gui = new GUI();
				params = {
					debugFlowMap: false
				};
				gui.add(params, 'debugFlowMap').name('Debug Flow Map').onChange(v => {
					landscapeParticles.material.uniforms.u_debugFlow.value = v;
				});
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			function animate() {
				requestAnimationFrame(animate);
				render(); 
			}

			function render() {
				const deltaTime = clock.getDelta();
				
				// --- AI --- Update Fluid Simulation First ---
				if(fluidCompute) {
					// Advect the velocity field by itself
					fluidVelocityVar.material.uniforms['u_source'].value = fluidCompute.getCurrentRenderTarget(fluidVelocityVar).texture;
					fluidCompute.compute();
					
					// Inject forces from mouse
					if (pointer.move) {
						pointer.deltaX = pointer.x - pointer.prevX;
						pointer.deltaY = pointer.y - pointer.prevY;
						splat(pointer.x, pointer.y, pointer.deltaX, pointer.deltaY, new THREE.Color(0xffffff));
						pointer.prevX = pointer.x;
						pointer.prevY = pointer.y;
					}

					// Compute divergence
					fluidDivergenceVar.material.uniforms['u_velocity'].value = fluidCompute.getCurrentRenderTarget(fluidVelocityVar).texture;
					fluidCompute.compute();
					
					// Iteratively solve for pressure
					let p = fluidCompute.getCurrentRenderTarget(fluidPressureVar).texture;
					for(let i=0; i<10; i++) {
						fluidPressureVar.material.uniforms['u_pressure'].value = p;
						fluidPressureVar.material.uniforms['u_divergence'].value = fluidCompute.getCurrentRenderTarget(fluidDivergenceVar).texture;
						fluidCompute.compute();
						p = fluidCompute.getCurrentRenderTarget(fluidPressureVar).texture;
					}
					
					// Subtract pressure gradient from velocity
					const gradientMaterial = fluidCompute.createShaderMaterial(gradientSubtractShader, {
						u_pressure: { value: p },
						u_velocity: { value: fluidCompute.getCurrentRenderTarget(fluidVelocityVar).texture },
						u_texelSize: { value: new THREE.Vector2(1.0 / F_GPGPU_WIDTH, 1.0 / F_GPGPU_HEIGHT) }
					});
					fluidCompute.doRenderTarget(gradientMaterial, fluidVelocityVar.renderTargets[0]);
				}


				// --- AI --- Update Particle Simulation ---
				particleCompute.compute();
                const posTex = particleCompute.getCurrentRenderTarget(particlePositionVar).texture;
                if (landscapeParticles) {
                    landscapeParticles.material.uniforms.texturePosition.value = posTex;
					if (fluidCompute) {
						landscapeParticles.material.uniforms.u_flowMap.value = fluidCompute.getCurrentRenderTarget(fluidVelocityVar).texture;
					}
                }
				renderer.render(scene, camera);
			}
			
			// --- AI --- New function to add forces to the fluid simulation
			function splat(x, y, dx, dy, color) {
				const splatMaterial = fluidCompute.createShaderMaterial(splatShader, {
					u_target: { value: fluidCompute.getCurrentRenderTarget(fluidVelocityVar).texture },
					u_aspectRatio: { value: window.innerWidth / window.innerHeight },
					u_point: { value: new THREE.Vector2(x / window.innerWidth, 1.0 - y / window.innerHeight) },
					u_color: { value: new THREE.Vector3(dx, -dy, 1.0) }, // Use delta for force direction
					u_radius: { value: 0.0005 } // Radius of the splat
				});
				fluidCompute.doRenderTarget(splatMaterial, fluidVelocityVar.renderTargets[0]);
			}
		</script>
	</body>
</html>
