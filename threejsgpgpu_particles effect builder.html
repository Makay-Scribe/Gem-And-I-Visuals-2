<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPGPU Particle Morph Test (Fixed)</title>
    <style>
        /* Basic CSS Reset & Styling */
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 5px;
            z-index: 2;
            width: 280px;
        }
        #ui-panel h3 {
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .ui-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .ui-row label {
            margin-right: 10px;
        }
        .ui-row input[type="range"] {
            flex-grow: 1;
        }
        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5em;
            z-index: 3;
        }
    </style>

    <!-- 
      FIX: IMPORT MAP
      This tells the browser how to resolve "bare" module specifiers like 'three'.
      When any imported file (including addons) says `import ... from 'three'`, 
      the browser will now know to load it from the specified CDN URL.
    -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/"
        }
    }
    </script>

</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div id="ui-panel">
        <h3>Controls</h3>
        <div id="loading-indicator">Loading Model...</div>
        <div id="controls-container" style="display: none;">
            <div class="ui-row">
                <label for="morph-slider">Morph</label>
                <input type="range" id="morph-slider" min="0" max="1" step="0.001" value="0">
            </div>
            <div class="ui-row">
                <label for="size-slider">Particle Size</label>
                <input type="range" id="size-slider" min="1" max="15" step="0.1" value="3.0">
            </div>
            <div class="ui-row">
                <label for="speed-slider">Rotate Speed</label>
                <input type="range" id="speed-slider" min="0" max="1" step="0.01" value="0.2">
            </div>
        </div>
    </div>

    <!-- GPGPU Position Computation Shader -->
    <script id="positionFragmentShader" type="x-shader/x-fragment">
        // This shader calculates the new position of each particle by mixing
        // between its starting position on the plane and its target position on the model.
        uniform sampler2D u_initialPositionMap;
        uniform sampler2D u_modelPositionMap;
        uniform float u_morphProgress; // The 0.0 to 1.0 value from the slider

        void main() {
            // Get the UV coordinate for this pixel, which corresponds to a particle
            vec2 uv = gl_FragCoord.xy / resolution.xy;

            // Fetch the position from the two state textures
            vec4 initialPos = texture2D(u_initialPositionMap, uv);
            vec4 modelPos = texture2D(u_modelPositionMap, uv);

            // Linearly interpolate (mix) between the two positions
            vec3 newPosition = mix(initialPos.xyz, modelPos.xyz, u_morphProgress);

            // Output the new position to be stored in the GPGPU texture
            gl_FragColor = vec4(newPosition, 1.0);
        }
    </script>

    <!-- Particle Rendering Vertex Shader -->
    <script id="particleVertexShader" type="x-shader/x-vertex">
        // This shader reads the particle's position from the GPGPU texture
        // and places it in the 3D world.
        uniform sampler2D u_positions; // The GPGPU texture with current particle positions
        uniform float u_pointSize;
        attribute vec2 uv; // Each particle has a UV to look up its data in the texture

        void main() {
            // Fetch the position of this particle from the GPGPU texture
            vec3 pos = texture2D(u_positions, uv).xyz;

            // Standard projection
            vec4 modelViewPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * modelViewPosition;
            gl_PointSize = u_pointSize;
        }
    </script>

    <!-- Particle Rendering Fragment Shader -->
    <script id="particleFragmentShader" type="x-shader/x-fragment">
        // This shader determines the color and shape of each particle.
        void main() {
            // Create a circular shape for the particle
            if (length(gl_PointCoord - vec2(0.5, 0.5)) > 0.475) discard;
            gl_FragColor = vec4(0.2, 0.5, 1.0, 1.0); // Set particle color
        }
    </script>


    <!-- Main JavaScript Application -->
    <script type="module">
        // FIX: Imports now use the bare specifiers defined in the importmap
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
        import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';

        // --- Configuration ---
        const PARTICLE_WIDTH = 512; // 512x512 grid
        const PARTICLE_COUNT = PARTICLE_WIDTH * PARTICLE_WIDTH; // 262,144 particles
        const PLANE_SIZE = 40; // World units for the initial flat plane
        const MODEL_URL = 'https://threejs.org/examples/models/gltf/Flower.glb'; // Free model from Three.js examples

        let scene, camera, renderer, clock, particlePoints;
        let gpuCompute, positionVariable;
        let modelPositionTexture = null;

        function init() {
            // --- Basic Scene Setup ---
            scene = new THREE.Scene();
            clock = new THREE.Clock();
            
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35);
            camera.lookAt(0, 0, 0);

            // --- GPGPU Setup ---
            gpuCompute = new GPUComputationRenderer(PARTICLE_WIDTH, PARTICLE_WIDTH, renderer);
            if (!gpuCompute.isSupported) {
                alert('GPGPU not supported. Please use a modern browser and hardware.');
                return;
            }

            // --- State A: Initial Plane Data Texture ---
            const initialPositionData = gpuCompute.createTexture();
            fillInitialPositionTexture(initialPositionData);

            // --- GPGPU Position Variable ---
            positionVariable = gpuCompute.addVariable("texturePosition", document.getElementById('positionFragmentShader').textContent, initialPositionData);
            
            // --- GPGPU Uniforms ---
            positionVariable.material.uniforms['u_initialPositionMap'] = { value: initialPositionData };
            positionVariable.material.uniforms['u_modelPositionMap'] = { value: null }; // Will be set after model load
            positionVariable.material.uniforms['u_morphProgress'] = { value: 0.0 };

            const error = gpuCompute.init();
            if (error !== null) {
                console.error(error);
            }

            // --- Particle System (Points) ---
            const geometry = new THREE.BufferGeometry();
            const uv = new Float32Array(PARTICLE_COUNT * 2);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const u = (i % PARTICLE_WIDTH) / PARTICLE_WIDTH;
                const v = Math.floor(i / PARTICLE_WIDTH) / PARTICLE_WIDTH;
                uv[i * 2] = u;
                uv[i * 2 + 1] = v;
            }
            geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    u_positions: { value: null }, // Will be linked to GPGPU output
                    u_pointSize: { value: 3.0 },
                },
                vertexShader: document.getElementById('particleVertexShader').textContent,
                fragmentShader: document.getElementById('particleFragmentShader').textContent,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            });

            particlePoints = new THREE.Points(geometry, material);
            scene.add(particlePoints);

            // --- Load 3D Model for State B ---
            loadModel();

            // --- UI & Event Listeners ---
            setupUI();
            window.addEventListener('resize', onWindowResize);
        }

        function fillInitialPositionTexture(texture) {
            const arr = texture.image.data;
            for (let i = 0; i < arr.length; i += 4) {
                const particleIndex = i / 4;
                const col = particleIndex % PARTICLE_WIDTH;
                const row = Math.floor(particleIndex / PARTICLE_WIDTH);

                // Map grid position to a centered plane
                arr[i + 0] = (col / PARTICLE_WIDTH - 0.5) * PLANE_SIZE; // x
                arr[i + 1] = (row / PARTICLE_WIDTH - 0.5) * PLANE_SIZE; // y
                arr[i + 2] = 0; // z
                arr[i + 3] = 1; // w
            }
        }

        function loadModel() {
            const loader = new GLTFLoader();
            loader.load(MODEL_URL, (gltf) => {
                let modelMesh = null;
                gltf.scene.traverse(child => {
                    if (child.isMesh && !modelMesh) {
                        modelMesh = child;
                    }
                });

                if (!modelMesh) {
                    console.error("No mesh found in the GLTF file.");
                    return;
                }

                // --- Bake Model into Data Texture ---
                modelPositionTexture = gpuCompute.createTexture();
                const sampler = new MeshSurfaceSampler(modelMesh).build();
                const position = new THREE.Vector3();
                const arr = modelPositionTexture.image.data;

                for (let i = 0; i < arr.length; i += 4) {
                    sampler.sample(position);
                    arr[i + 0] = position.x;
                    arr[i + 1] = position.y;
                    arr[i + 2] = position.z;
                    arr[i + 3] = 1;
                }
                
                // Link the baked texture to the GPGPU shader
                positionVariable.material.uniforms['u_modelPositionMap'].value = modelPositionTexture;

                // Hide loading indicator and show controls
                document.getElementById('loading-indicator').style.display = 'none';
                document.getElementById('controls-container').style.display = 'block';

                // Start the animation loop only after the model is ready
                animate();
            }, undefined, (error) => {
                console.error(error);
                document.getElementById('loading-indicator').innerText = 'Error loading model.';
            });
        }
        
        function setupUI() {
            const morphSlider = document.getElementById('morph-slider');
            const sizeSlider = document.getElementById('size-slider');

            morphSlider.addEventListener('input', (e) => {
                positionVariable.material.uniforms['u_morphProgress'].value = parseFloat(e.target.value);
            });
            
            sizeSlider.addEventListener('input', (e) => {
                particlePoints.material.uniforms.u_pointSize.value = parseFloat(e.target.value);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // --- GPGPU Update ---
            gpuCompute.compute();
            
            // --- Link GPGPU output to particle shader ---
            particlePoints.material.uniforms.u_positions.value = gpuCompute.getCurrentRenderTarget(positionVariable).texture;

            // --- Animate Scene ---
            const rotateSpeed = document.getElementById('speed-slider').value;
            if(particlePoints){
                const elapsedTime = clock.getElapsedTime();
                particlePoints.rotation.y = elapsedTime * rotateSpeed * 0.5;
                particlePoints.rotation.x = elapsedTime * rotateSpeed * 0.2;
            }

            // --- Render ---
            renderer.render(scene, camera);
        }

        // --- Start the application ---
        init();

    </script>
</body>
</html>
