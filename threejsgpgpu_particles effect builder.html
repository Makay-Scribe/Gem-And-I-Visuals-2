<!DOCTYPE html>
<html lang="en">
<head>
    <title>Three.js GPGPU Hydrofluid Particle Simulator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="icon" href="data:,">
    <style>
        body {
            color: #fff;
            font-family: Monospace;
            font-size: 13px;
            text-align: center;
            font-weight: bold;
            background-color: #000;
            margin: 0px;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 0px;
            width: 100%;
            padding: 5px;
            z-index: 5;
        }
        #container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }
        .lil-gui {
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="container"></div>
    <div id="info">
        Three.js GPGPU Hydrofluid Particle Simulator
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/",
                 "lil-gui": "https://unpkg.com/lil-gui@0.19.1/dist/lil-gui.esm.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GUI } from 'lil-gui';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';

        let container;
        let camera, scene, renderer;
        let controls;
        let particles;
        let gpuCompute;
        let velocityVariable;
        let positionVariable;
        let velocityUniforms;
        let particleUniforms;
        let clock;

        const WIDTH = 256;
        const PARTICLES = WIDTH * WIDTH;

        // Using texture2D for maximum compatibility between WebGL1 and WebGL2
        const fragmentShaderPosition = `
            uniform float delta;
            void main() {
                vec2 uv = gl_FragCoord.xy / resolution.xy;
                vec4 posTex = texture2D( texturePosition, uv );
                vec4 velTex = texture2D( textureVelocity, uv );
                vec3 pos = posTex.xyz;
                vec3 vel = velTex.xyz;
                pos += vel * delta * 50.0;
                gl_FragColor = vec4( pos, 1.0 );
            }
        `;

        const fragmentShaderVelocity = `
            uniform vec2 mouse;
            uniform float viscosity;
            uniform float mouseRadius;
            uniform float time;

            void main() {
                vec2 uv = gl_FragCoord.xy / resolution.xy;
                vec4 posTex = texture2D( texturePosition, uv );
                vec4 velTex = texture2D( textureVelocity, uv );
                vec3 pos = posTex.xyz;
                vec3 vel = velTex.xyz;
                vec2 toMouse = mouse - pos.xy;
                float dist = length(toMouse);

                // Safeguard against division by zero in normalize()
                if (dist < mouseRadius && dist > 0.001) {
                    float force = (mouseRadius - dist) * 0.02;
                    vel.xy += normalize(toMouse) * force;
                }

                vel.xy -= pos.xy * 0.0001;
                vel.x += sin(pos.y * 0.1 + time) * 0.01;
                vel.y += cos(pos.x * 0.1 + time) * 0.01;
                vel *= viscosity;
                gl_FragColor = vec4( vel, 1.0 );
            }
        `;

        init();
        animate();

        function init() {
            container = document.getElementById('container');
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 3000);
            camera.position.set(0, 150, 500);

            scene = new THREE.Scene();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            initComputeRenderer();
            initParticles();
            initGUI();
        }

        function initComputeRenderer() {
            gpuCompute = new GPUComputationRenderer(WIDTH, WIDTH, renderer);
            if (renderer.capabilities.isWebGL2 === false) {
                gpuCompute.setDataType(THREE.HalfFloatType);
            }

            const dtPosition = gpuCompute.createTexture();
            const dtVelocity = gpuCompute.createTexture();
            fillPositionTexture(dtPosition);
            fillVelocityTexture(dtVelocity);

            velocityVariable = gpuCompute.addVariable("textureVelocity", fragmentShaderVelocity, dtVelocity);
            positionVariable = gpuCompute.addVariable("texturePosition", fragmentShaderPosition, dtPosition);

            gpuCompute.setVariableDependencies(velocityVariable, [positionVariable, velocityVariable]);
            gpuCompute.setVariableDependencies(positionVariable, [positionVariable, velocityVariable]);

            velocityUniforms = velocityVariable.material.uniforms;
            velocityUniforms['mouse'] = { value: new THREE.Vector2(10000, 10000) };
            velocityUniforms['viscosity'] = { value: 0.98 };
            velocityUniforms['mouseRadius'] = { value: 50.0 };
            velocityUniforms['time'] = { value: 0.0 };

            const error = gpuCompute.init();
            if (error !== null) { console.error(error); }
        }

        function initParticles() {
            const geometry = new THREE.BufferGeometry();
            const uvs = new Float32Array(PARTICLES * 2);
            for (let j = 0, p = 0; j < WIDTH; j++) {
                for (let i = 0; i < WIDTH; i++) {
                    uvs[p++] = i / (WIDTH - 1);
                    uvs[p++] = j / (WIDTH - 1);
                }
            }
            geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

            particleUniforms = {
                'texturePosition': { value: null },
                'particleColor': { value: new THREE.Color(0xffffff) },
                'particleSize': { value: 2.0 },
            };

            const material = new THREE.ShaderMaterial({
                uniforms: particleUniforms,
                vertexShader: `
                    uniform sampler2D texturePosition;
                    uniform float particleSize;
                    void main() {
                        vec3 pos = texture2D(texturePosition, uv).xyz;
                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        gl_PointSize = particleSize * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 particleColor;
                    void main() {
                        if (length(gl_PointCoord - vec2(0.5, 0.5)) > 0.475) discard;
                        gl_FragColor = vec4(particleColor, 1.0);
                    }
                `,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthTest: false,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            particles.frustumCulled = false;
            scene.add(particles);
        }

        function fillPositionTexture(texture) {
            const arr = texture.image.data;
            for (let i = 0; i < arr.length; i += 4) {
                arr[i + 0] = Math.random() * 100 - 50;
                arr[i + 1] = Math.random() * 100 - 50;
                arr[i + 2] = Math.random() * 100 - 50;
                arr[i + 3] = 1;
            }
        }

        function fillVelocityTexture(texture) {
            const arr = texture.image.data;
            for (let i = 0; i < arr.length; i += 4) {
                arr[i + 0] = (Math.random() - 0.5) * 2;
                arr[i + 1] = (Math.random() - 0.5) * 2;
                arr[i + 2] = (Math.random() - 0.5) * 2;
                arr[i + 3] = 1;
            }
        }

        function initGUI() {
            const gui = new GUI({ title: 'Controls' });
            const effectController = {
                viscosity: 0.98,
                mouseRadius: 50.0,
                particleSize: 2.0,
                particleColor: 0x00c0ff,
                bgColor: 0x000000,
            };

            const simulationFolder = gui.addFolder('Simulation').open();
            simulationFolder.add(effectController, 'viscosity', 0.9, 0.999, 0.001).onChange(v => velocityUniforms.viscosity.value = v);
            simulationFolder.add(effectController, 'mouseRadius', 1.0, 200.0).onChange(v => velocityUniforms.mouseRadius.value = v);

            const particlesFolder = gui.addFolder('Particles').open();
            particlesFolder.add(effectController, 'particleSize', 0.1, 10.0).onChange(v => particleUniforms.particleSize.value = v);
            particlesFolder.addColor(effectController, 'particleColor').onChange(v => particleUniforms.particleColor.value.set(v));

            const worldFolder = gui.addFolder('Camera & World').open();
            worldFolder.addColor(effectController, 'bgColor').onChange(v => scene.background = new THREE.Color(v));
            
            scene.background = new THREE.Color(effectController.bgColor);
            particleUniforms.particleColor.value.set(effectController.particleColor);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', onWindowResize);

        function onPointerMove(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width * 2 - 1;
            const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            const vector = new THREE.Vector3(x, y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            
            // --- THE CRITICAL FIX ---
            // If the ray from the camera is parallel to the Z=0 plane, the projection calculation
            // will result in Infinity, which corrupts the simulation. We must prevent this.
            if (Math.abs(dir.z) < 0.0001) {
                return; // Ignore mouse movement along the horizon
            }
            
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));
            velocityUniforms.mouse.value.set(pos.x, pos.y);
        }
        document.addEventListener('pointermove', onPointerMove);

        function animate() {
            requestAnimationFrame(animate);
            render();
        }

        function render() {
            let delta = clock.getDelta();
            // Clamp delta to prevent physics explosions on long frames
            if (delta > 0.1) delta = 0.1;

            velocityUniforms.time.value += delta;
            
            gpuCompute.compute();
            particleUniforms.texturePosition.value = gpuCompute.getCurrentRenderTarget(positionVariable).texture;
            
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
